name: Something doesn't work
description: An entity, the card, setup or the relay app is wrong or broken.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. A few details make this much quicker to fix. Please look through the
        [troubleshooting table](https://github.com/bscholer/home-assistant-dwarf#if-something-looks-wrong) first.
        Don't paste your scope's Wi-Fi password, your address or any token. Diagnostics already leave those out.
  - type: dropdown
    id: area
    attributes:
      label: Where is the problem?
      options:
        - Setup, discovery or reconfigure
        - Dashboard card
        - Entities, buttons or actions
        - Live video (camera)
        - Stacks, Media or casting
        - Relay app (install, start or connection)
        - Something else
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Which mode are you using?
      options:
        - Read-only
        - Full control, relay app installed by the integration
        - Full control, relay app installed by hand
        - Full control, relay in Docker
        - Not sure
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
      description: Include the steps you took. Screenshots are welcome, and for the card say whether you use a panel view.
    validations:
      required: true
  - type: input
    id: ha
    attributes:
      label: Home Assistant version
      placeholder: "2026.11.1"
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How is Home Assistant installed?
      options:
        - Home Assistant OS
        - Supervised
        - Container
        - Core
        - Not sure
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Integration version
      description: Settings → Devices & services → DWARF 3, or the Home Assistant marketplace.
      placeholder: "0.6.2"
    validations:
      required: true
  - type: input
    id: firmware
    attributes:
      label: DWARF 3 firmware and the DWARFLAB app version, if you know them
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Settings → Devices & services → DWARF 3 → ⋮ → Download diagnostics, then drag the file in here.
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        Settings → System → Logs, filtered by "dwarf". For the relay app, open the app's **Log** tab. For the card, the
        browser console (F12) errors that mention dwarf. Turn on debug logging if you can.
      render: text
