configuration:
  scope_host:
    name: Telescope IP address
    description: >-
      The IP address of your DWARF 3, for example 192.168.1.50. Find it in your router's list of devices.
  auth:
    name: Require an access token
    description: >-
      Off is fine for most homes: any device on your network can control the scope, as it already can
      without the relay. Turn on to require the token below.
  api_token:
    name: Access token
    description: >-
      Only used when the switch above is on. Leave empty and the app makes one and shows it in the Log tab.
  latitude:
    name: Site latitude (optional)
    description: Leave empty to use this Home Assistant's location. Only the Prepare button uses it.
  longitude:
    name: Site longitude (optional)
    description: Leave empty to use this Home Assistant's location.
  timezone:
    name: Site time zone (optional)
    description: Leave empty to use this Home Assistant's time zone, or enter a name like America/Chicago.
