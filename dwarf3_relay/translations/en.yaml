configuration:
  scope_host:
    name: Telescope IP address
    description: >-
      The IP address of your DWARF 3 on your Wi-Fi network, for example 192.168.1.50.
      Give the scope a fixed address in your router so it does not change. Required.
  api_token:
    name: Access token
    description: >-
      A password that Home Assistant and other tools send to control the scope. Use a long random string
      and keep it private. Leave empty to have the app make one and print it in the Log tab. Enter the same
      value when you add the integration.
  auth:
    name: Require the access token
    description: >-
      Keep this on. Turn it off only on a network where every device is trusted, because any device that
      can reach this app could then move the scope.
  latitude:
    name: Site latitude
    description: >-
      Your observing site, in decimal degrees (for example 41.88). Only the Prepare button needs it.
      Leave empty to skip. Nothing is guessed.
  longitude:
    name: Site longitude
    description: >-
      Your observing site, in decimal degrees (for example -87.63). Only the Prepare button needs it.
      Leave empty to skip.
  timezone:
    name: Site time zone
    description: >-
      A time zone name such as America/Chicago. Only the Prepare button needs it. Leave empty to skip.
